<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程存储管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 全局过渡，主题切换更流畅 */
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }

        :root {
            --primary: #4080ff;
            --success: #52c41a;
            --warning: #faad14;
            --danger: #ff4d4f;
            --bg: #f5f7fa;
            --card: #ffffff;
            --border: #e4e7ed;
            --text: #303133;
            --text-secondary: #909399;
            --hover: #f5f7fa;
            --shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 4px 16px 0 rgba(64, 128, 255, 0.15);
            --sidebar-width: 280px;
            /* 登录页同步的玻璃态/动效变量 */
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(64, 128, 255, 0.25);
            --particle-color: rgba(64, 128, 255, 0.5);
        }

        /* 深色模式变量 */
        [data-theme="dark"] {
            --primary: #66a3ff;
            --success: #67c23a;
            --warning: #e6a23c;
            --danger: #f56c6c;
            --bg: #121218;
            --card: #1e1e2a;
            --border: #2d2d3f;
            --text: #e0e0e0;
            --text-secondary: #9ca3af;
            --hover: #2a2a3a;
            --shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 4px 16px 0 rgba(102, 163, 255, 0.2);
            /* 登录页同步的深色模式变量 */
            --glass-bg: rgba(30, 30, 42, 0.6);
            --glass-border: rgba(102, 163, 255, 0.35);
            --particle-color: rgba(102, 163, 255, 0.5);
        }

        /* ========== 登录页同步背景动效 ========== */
        /* 网格背景 */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(64, 128, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(64, 128, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }
        /* 中心发光效果 */
        .glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 1200px;
            height: 1200px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(64, 128, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        /* 浮动粒子 */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--particle-color);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        /* 亮色模式浮动图标 */
        .background-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.2;
        }
        .background-icons .icon {
            position: absolute;
            font-size: 48px;
            color: var(--primary);
            animation: floatIcon 15s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -10px) rotate(5deg); }
            50% { transform: translate(-5px, -20px) rotate(-5deg); }
            75% { transform: translate(-10px, -5px) rotate(3deg); }
        }
        /* 深色模式星空 */
        .galaxy-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            display: none;
        }
        [data-theme="dark"] .galaxy-stars { display: block; }
        [data-theme="dark"] .background-icons { display: none; }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--twinkle-duration, 3s) ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        /* 通用动效 */
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏 - 玻璃态改造 */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(1px);
            padding: 12px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 0 0 16px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            z-index: 10;
            margin: 0 8px 8px 8px;
            position: relative;
        }
        /* 顶部栏发光边框 */
        .header::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg, rgba(69, 100, 255, 0.3), rgba(92, 124, 255, 0.3), rgba(78, 114, 255, 0.66), rgba(0,102,255,0.3));
            border-radius: 0 0 17px 17px;
            z-index: -1;
            animation: borderGlow 4s linear infinite;
            background-size: 300% 300%;
            opacity: 0.6;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 36px;
            margin-right: 12px;
            object-fit: contain;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #80b3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* 圆形深浅模式切换按钮 - 对齐登录页风格 */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle:hover {
            background: var(--primary);
            transform: rotate(15deg);
            border-color: var(--primary);
            box-shadow: 0 6px 20px rgba(64, 128, 255, 0.3);
        }
        .theme-toggle:hover .icon {
            color: white;
        }
        .theme-toggle .icon {
            position: absolute;
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle .sun {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
        .theme-toggle .moon {
            opacity: 0;
            transform: rotate(90deg) scale(0.8);
        }
        /* 深色模式下切换为月亮 */
        [data-theme="dark"] .theme-toggle .sun {
            opacity: 0;
            transform: rotate(-90deg) scale(0.8);
        }
        [data-theme="dark"] .theme-toggle .moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        /* 按钮通用动效 - 对齐登录页渐变+扫光 */
        button {
            padding: 8px 16px !important;
            border-radius: 8px !important;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #3eafff, #207dff, #7077ff);
            background-size: 200% 200%;
            animation: btnGradient 3s ease infinite;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 按钮扫光效果 */
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        button:hover::before {
            left: 100%;
        }
        button:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3) !important;
        }
        button:active {
            transform: translateY(0) !important;
        }
        button:disabled {
            background: var(--text-secondary) !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            animation: none !important;
            opacity: 0.6;
        }
        /* 危险按钮渐变 */
        button.danger {
            background: linear-gradient(135deg, #ff4d4f, #ff7875, #ffccc7) !important;
        }
        button.danger:hover {
            box-shadow: 0 10px 30px rgba(255, 77, 79, 0.3) !important;
        }
        /* 取消按钮渐变 */
        .btn-cancel {
            background: linear-gradient(135deg, #909399, #c0c4cc, #e4e7ed) !important;
            color: var(--text);
        }
        .btn-cancel:hover {
            box-shadow: 0 10px 30px rgba(144, 147, 153, 0.3) !important;
        }

        /* 主内容区：左右布局 */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            gap: 8px;
            padding: 0 8px 8px 8px;
        }

        /* 左侧目录树 - 玻璃态改造 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow-y: auto;
            padding: 15px;
            transition: width 0.3s ease, padding 0.3s ease;
            flex-shrink: 0;
            box-shadow: var(--shadow);
            z-index: 5;
            position: relative;
        }
        /* 侧边栏发光边框 */
        .sidebar::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg, rgba(0,102,255,0.2), rgba(0,212,255,0.2), rgba(0,255,204,0.2), rgba(0,102,255,0.2));
            border-radius: 17px;
            z-index: -1;
            animation: borderGlow 4s linear infinite;
            background-size: 300% 300%;
            opacity: 0.5;
        }

        .sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }

        /* 侧边栏拖动手柄 */
        .resize-handle {
            width: 4px;
            background: var(--border);
            cursor: col-resize;
            flex-shrink: 0;
            z-index: 10;
            transition: background 0.2s;
            border-radius: 2px;
            margin: 0 2px;
        }
        .resize-handle:hover, .resize-handle.active {
            background: var(--primary);
        }
        .sidebar.collapsed ~ .resize-handle {
            display: none;
        }

        .sidebar-toggle {
            position: absolute;
            left: var(--sidebar-width);
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: left 0.3s ease, background 0.2s ease;
        }
        .sidebar-toggle:hover {
            background: var(--primary);
        }
        .sidebar-toggle:hover .sidebar-toggle-icon {
            color: white;
        }

        /* 修复侧边栏收起后按钮不缩回去的问题 */
        .sidebar.collapsed ~ .sidebar-toggle {
            left: 0;
        }

        .sidebar-toggle-icon {
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .sidebar.collapsed ~ .sidebar-toggle .sidebar-toggle-icon {
            transform: rotate(180deg);
        }

        .tree-title {
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
        }

        .tree-node {
            margin: 5px 0;
        }

        .tree-node-header {
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tree-node-header:hover, .tree-node-header.active {
            background: var(--hover);
            padding-left: 14px;
            transform: translateX(4px);
        }

        .tree-toggle {
            width: 16px;
            text-align: center;
            cursor: pointer;
        }

        .tree-children {
            margin-left: 20px;
            display: none;
        }

        .tree-children.open {
            display: block;
        }

        /* 右侧文件区 */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            gap: 1px;
        }

        /* 工具栏 - 玻璃态改造 */
        .toolbar {
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            padding: 12px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 16px 16px 0 0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }

        /* 路径栏 - 玻璃态改造 */
        .path-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(6px);
            padding: 10px 20px;
            border: 1px solid var(--glass-border);
            border-top: none;
            border-bottom: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
        }

        .path-breadcrumb {
            display: flex;
            align-items: center;
            flex: 1;
            flex-wrap: wrap;
            gap: 5px;
        }

        .path-item {
            color: var(--primary);
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .path-item:hover {
            background: var(--hover);
            transform: translateY(-1px);
        }

        .path-sep {
            color: var(--text-secondary);
        }

        /* 文件列表 - 玻璃态改造 */
        .file-list-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            border-radius: 0 0 16px 16px;
            box-shadow: var(--shadow);
            position: relative;
        }
        /* 文件列表发光边框 */
        .file-list-container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(45deg, rgba(0,102,255,0.2), rgba(0,212,255,0.2), rgba(0,255,204,0.2), rgba(0,102,255,0.2));
            border-radius: 0 0 17px 17px;
            z-index: -1;
            animation: borderGlow 4s linear infinite;
            background-size: 300% 300%;
            opacity: 0.5;
        }

        .table-header {
            display: grid;
            grid-template-columns: 40px 3fr 1fr 1fr 120px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.02);
        }
        [data-theme="dark"] .table-header {
            background: rgba(255,255,255,0.02);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
        }

        .file-item {
            display: grid;
            grid-template-columns: 40px 3fr 1fr 1fr 120px;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            animation: fadeIn 0.3s ease forwards;
        }
        [data-theme="dark"] .file-item {
            border-bottom-color: rgba(255,255,255,0.05);
        }

        .file-item:hover {
            background: var(--hover);
            border-left-color: var(--primary);
            padding-left: 17px;
            transform: translateX(4px);
            box-shadow: var(--shadow-hover);
        }

        .file-item.selected {
            background: rgba(64, 128, 255, 0.1);
            border-left-color: var(--primary);
            padding-left: 17px;
            transform: translateX(4px);
            box-shadow: 0 4px 16px 0 rgba(64, 128, 255, 0.2);
        }

        .file-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            display: none; /* 默认隐藏 */
            accent-color: var(--primary);
        }

        .file-list.show-checkbox .file-checkbox {
            display: block; /* 批量删除时显示 */
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-icon {
            font-size: 20px;
        }

        .file-size, .file-mtime {
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .file-actions button {
            padding: 4px 8px !important;
            font-size: 12px;
            border-radius: 6px !important;
            font-weight: 500;
        }

        /* 右键菜单/更多菜单 - 玻璃态改造 */
        #context-menu, #more-menu {
            position: fixed;
            width: 180px;
            background: var(--glass-bg) !important;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border) !important;
            border-radius: 12px !important;
            box-shadow: var(--shadow);
            z-index: 9999;
            display: none;
            animation: bounceIn 0.2s ease forwards;
            padding: 4px;
        }

        .menu-item {
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 8px;
            margin: 2px 0;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background: var(--hover);
            transform: translateX(4px);
        }

        .menu-item.danger {
            color: var(--danger);
        }

        .menu-separator {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* 属性弹窗样式 */
        .attr-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
        }

        .attr-item:last-child {
            border-bottom: none;
        }

        .attr-label {
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 100px;
            flex-shrink: 0;
        }

        .attr-value {
            color: var(--text);
            word-break: break-all;
        }

        /* 模态框通用 - 玻璃态改造 */
        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(4px); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.03); }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            display: none;
            animation: fadeIn 0.2s ease forwards;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.7) !important; 
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px !important;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            animation: bounceIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            position: relative;
        }
        /* 模态框发光边框 */
        .modal-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: rgba(121, 195, 255, 0.7) !important; 
            border-radius: 18px;
            z-index: -1;
            opacity: 0.6;
            animation: borderGlow 4s linear infinite;
            background-size: 300% 300%;
        }
        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 18px;
        }

        .modal-close {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 24px;
            transition: color 0.2s, transform 0.2s;
            line-height: 1;

        .modal-footer {
            padding: 16px 24px;

        /* 表单样式 对齐登录页 */
        .form-item {
            margin-bottom: 20px;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;

        .form-item input, .form-item textarea {
            width: 100%;

        .form-item input:focus, .form-item textarea:focus {

        .form-item input::placeholder {

        .form-tip {

            color: var(--text-secondary);

        /* 编辑器模态框 */
        #editor-modal .modal-box {
            max-width: 1000px;
            height: 80vh;
        }

        #file-editor {
            width: 100%;
            height: 100%;
            min-height: 500px;

        /* 预览模态框 */

        /* 空状态 */

            font-size: 16px;
        }

        /* 上传文件输入框 */
        #file-input {
            display: none;
        }
    </style>
</head>

    <script>
        // 全局变量
        let currentPath = '';
        let selectedItems = [];
        let clipboard = { type: '', paths: [] };
        let currentActiveItem = '';
        let selectedTargetPath = '';
        let isBatchMode = false;
        let treeData = [];
        let currentFileList = []; // 存储当前文件列表，用于批量模式恢复
        let isSidebarCollapsed = false;
        let moreMenuTarget = null; // 更多菜单当前操作的文件路径
        let moreMenuFileInfo = {}; // 更多菜单当前文件的详细信息
        let currentTheme = 'light';

        // 初始化
        window.onload = function() {
            initTheme();
            initSidebarResize();
            loadDirTree();
            loadFileList();
            bindEvents();
            checkWindowSize();
            // 初始化背景动效
            createParticles();
            createBackgroundIcons();
            createGalaxyStars();
        }

        // ========== 背景动效函数 与登录页同步 ==========
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 20 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.3;
                particle.style.width = (Math.random() * 3 + 1) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }
        function createBackgroundIcons() {
            const container = document.getElementById('backgroundIcons');
            const icons = ['📁', '💾', '📄', '📊', '🔍', '⚡', '🌐', '📱', '📎', '💡', '🎯', '🚀'];
            const iconCount = 45;
            for (let i = 0; i < iconCount; i++) {
                const icon = document.createElement('div');
                icon.className = 'icon';
                icon.textContent = icons[i % icons.length];
                icon.style.left = Math.random() * 100 + '%';
                icon.style.top = Math.random() * 100 + '%';
                icon.style.animationDelay = (Math.random() * 5) + 's';
                icon.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(icon);
            }
        }
        function createGalaxyStars() {
            const container = document.getElementById('galaxyStars');
            const starCount = 230;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.setProperty('--twinkle-duration', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                container.appendChild(star);
            }
        }

        // 初始化主题
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            currentTheme = savedTheme;
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        }

        // 切换主题
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
        }

        // 初始化侧边栏拖动
        function initSidebarResize() {
            const handle = document.getElementById('resizeHandle');
            const sidebar = document.getElementById('sidebar');
            let isResizing = false;
            let startX = 0;
            let startWidth = 0;

            // 读取保存的侧边栏宽度
            const savedWidth = localStorage.getItem('sidebarWidth');
            if (savedWidth) {
                document.documentElement.style.setProperty('--sidebar-width', `${savedWidth}px`);
            }

            handle.addEventListener('mousedown', (e) => {
                if (sidebar.classList.contains('collapsed')) return; // 收起时不能拖动
                isResizing = true;
                startX = e.clientX;
                startWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'));
                handle.classList.add('active');
                document.body.style.userSelect = 'none'; // 禁止选中文字
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const deltaX = e.clientX - startX;
                let newWidth = startWidth + deltaX;
                // 限制最小200px，最大500px
                newWidth = Math.max(200, Math.min(500, newWidth));
                document.documentElement.style.setProperty('--sidebar-width', `${newWidth}px`);
            });

            document.addEventListener('mouseup', () => {
                if (!isResizing) return;
                isResizing = false;
                handle.classList.remove('active');
                document.body.style.userSelect = '';
                // 保存宽度到localStorage
                const currentWidth = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width').trim();
                localStorage.setItem('sidebarWidth', currentWidth.replace('px', ''));
            });
        }

        // 检查窗口大小，自动收起目录树
        function checkWindowSize() {
            if (window.innerWidth < 900 && !isSidebarCollapsed) {
                toggleSidebar(true);
            }
        }

        // 监听窗口大小变化
        window.addEventListener('resize', checkWindowSize);

        // 切换目录树收起/展开
        function toggleSidebar(forceCollapse = null) {
            const sidebar = document.getElementById('sidebar');
            if (forceCollapse !== null) {
                isSidebarCollapsed = forceCollapse;
            } else {
                isSidebarCollapsed = !isSidebarCollapsed;
            }

            if (isSidebarCollapsed) {
                sidebar.classList.add('collapsed');
            } else {
                sidebar.classList.remove('collapsed');
                // 恢复之前保存的宽度
                const savedWidth = localStorage.getItem('sidebarWidth') || 280;
                document.documentElement.style.setProperty('--sidebar-width', `${savedWidth}px`);
            }
        }

        // 刷新文件列表
        function refreshFileList() {
            loadFileList();
            loadDirTree();
        }

        // 显示更多按钮下拉菜单
        function showMoreMenu(event, path, name, type, size, sizeFormat, mtime, ext) {
            event.stopPropagation();
            const menu = document.getElementById('more-menu');

            // 如果点击的是同一个按钮，切换显示/隐藏
            if (moreMenuTarget === path && menu.style.display === 'block') {
                menu.style.display = 'none';
                return;
            }

            moreMenuTarget = path;
            moreMenuFileInfo = {
                path: path,
                name: name,
                type: type,
                size: size,
                sizeFormat: sizeFormat,
                mtime: mtime,
                ext: ext
            };

            const rect = event.target.getBoundingClientRect();
            let left = rect.left;
            let top = rect.bottom + 5;

            // 显示菜单以获取其尺寸
            menu.style.display = 'block';
            const menuWidth = menu.offsetWidth;
            const menuHeight = menu.offsetHeight;

            // 边界检测：如果超出右边界，往左移动
            if (left + menuWidth > window.innerWidth) {
                left = window.innerWidth - menuWidth - 10;
            }
            if (left < 10) left = 10;

            // 边界检测：如果超出下边界，往上展开
            if (top + menuHeight > window.innerHeight) {
                top = rect.top - menuHeight - 5;
            }
            if (top < 10) top = 10;

            menu.style.left = `${left}px`;
            menu.style.top = `${top}px`;
        }

        // 更多菜单动作处理
        function moreMenuAction(action) {
            document.getElementById('more-menu').style.display = 'none';

            if (!moreMenuTarget) return;

            switch(action) {
                case 'download':
                    downloadFile(moreMenuTarget);
                    break;
                case 'share':
                    createShare(moreMenuTarget);
                    break;
                case 'copy':
                    copyItem([moreMenuTarget]);
                    break;
                case 'cut':

        // -------------------------- 目录树相关 --------------------------
        async function loadDirTree() {
            try {
                const res = await fetch('/api/dirtree', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.code === 0) {
                    treeData = data.data;
                    renderDirTree(treeData, document.getElementById('dir-tree'));
                }
            } catch (e) {
                console.error('加载目录树失败', e);
            }
        }

        function renderDirTree(nodes, container) {
            container.innerHTML = '';
            nodes.forEach(node => {
                const div = document.createElement('div');
                div.className = 'tree-node';
                // 根目录默认展开
                const isRoot = node.path === '';
                div.innerHTML = `
                    <div class="tree-node-header ${isRoot ? 'active' : ''}" data-path="${node.path}" onclick="selectTreeDir(this, '${node.path}')">
                        <span class="tree-toggle" onclick="event.stopPropagation(); toggleTreeNode(this)">${node.children.length > 0 ? (isRoot ? '▼' : '▶') : ''}</span>
                        <span>${node.name.includes('📂') ? '' : '📁'}</span>
                        <span>${node.name.replace('📂 ', '')}</span>
                    </div>
                    <div class="tree-children ${isRoot ? 'open' : ''}">
                        ${node.children.length > 0 ? renderDirTreeToString(node.children) : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderDirTreeToString(nodes) {
            let html = '';
            nodes.forEach(node => {
                html += `
                    <div class="tree-node">
                        <div class="tree-node-header" data-path="${node.path}" onclick="selectTreeDir(this, '${node.path}')">
                            <span class="tree-toggle" onclick="event.stopPropagation(); toggleTreeNode(this)">${node.children.length > 0 ? '▶' : ''}</span>
                            <span>📁</span>
                            <span>${node.name}</span>
                        </div>
                        <div class="tree-children">
                            ${node.children.length > 0 ? renderDirTreeToString(node.children) : ''}
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function toggleTreeNode(el) {
            const children = el.parentElement.nextElementSibling;
            if (children) {
                children.classList.toggle('open');
                el.innerText = children.classList.contains('open') ? '▼' : '▶';
            }
        }

        function selectTreeDir(el, path) {
            document.querySelectorAll('.tree-node-header').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            currentPath = path;
            loadFileList();
        }

        // -------------------------- 文件列表相关 --------------------------
        async function loadFileList() {
            try {
                const res = await fetch('/api/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: currentPath })
                });
                const data = await res.json();
                
                if (data.code !== 0) {
                    alert(data.msg);
                    document.getElementById('file-list').innerHTML = `<div class="empty-state">${data.msg}</div>`;
                    currentFileList = [];
                    return;
                }

                currentFileList = data.data; // 保存当前文件列表
                renderFileList(data.data);
                renderBreadcrumb();
                selectedItems = [];
                updateBatchButton();
            } catch (e) {
                alert('请求失败：' + e.message);
            }
        }

        function renderFileList(list) {
            const container = document.getElementById('file-list');
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">当前文件夹为空</div>';
                return;
            }

            let html = '';
            list.forEach(item => {
                const fullPath = currentPath ? `${currentPath}/${item.name}` : item.name;
                const isFolder = item.type === 'folder';
                const isSelected = selectedItems.includes(fullPath);

                html += `
                    <div class="file-item ${isSelected ? 'selected' : ''}" 
                         data-path="${fullPath}" 
                         data-type="${item.type}"
                         ondblclick="${isFolder ? `enterFolder('${item.name}')` : `openPreview('${fullPath}')`}"
                         oncontextmenu="showContextMenu(event, '${fullPath}', '${item.type}')">
                        <div>
                            <input type="checkbox" class="file-checkbox" 
                                   ${isSelected ? 'checked' : ''} 
                                   onchange="toggleSelect('${fullPath}', this.checked)">
                        </div>
                        <div class="file-name">
                            <span class="file-icon">${isFolder ? '📁' : getFileIcon(item.ext)}</span>
                            <span>${item.name}</span>
                        </div>
                        <div class="file-size">${item.size_format}</div>
                        <div class="file-mtime">${item.mtime}</div>
                        <div class="file-actions">
                            ${isFolder ? `<button onclick="enterFolder('${item.name}')">进入</button>` : ''}
                            ${!isFolder ? `<button onclick="openPreview('${fullPath}')">预览</button>` : ''}
                            ${!isFolder && isTextFile(item.ext) ? `<button onclick="openEditor('${fullPath}')">编辑</button>` : ''}
                            <button onclick="showMoreMenu(event, '${fullPath}', '${item.name}', '${item.type}', '${item.size}', '${item.size_format}', '${item.mtime}', '${item.ext}')">更多 ▼</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderBreadcrumb() {
            const container = document.getElementById('path-breadcrumb');
            const paths = currentPath ? currentPath.split('/') : [];
            
            let html = `<span class="path-item" onclick="jumpToRoot()">根目录</span>`;
            let current = '';
            
            paths.forEach((path, index) => {
                current += (index === 0 ? '' : '/') + path;
                html += `
                    <span class="path-sep">/</span>
                    <span class="path-item" onclick="jumpToPath('${current}')">${path}</span>
                `;
            });
            
            container.innerHTML = html;
        }

        // -------------------------- 路径导航 --------------------------
        function enterFolder(name) {
            currentPath = currentPath ? `${currentPath}/${name}` : name;
            loadFileList();
            loadDirTree();
        }

        function goBack() {
            if (!currentPath) return;
            const paths = currentPath.split('/');
            paths.pop();
            currentPath = paths.join('/');
            loadFileList();
        }

        function jumpToRoot() {
            currentPath = '';
            loadFileList();
        }

        function jumpToPath(path) {
            currentPath = path;
            loadFileList();
        }

        // -------------------------- 批量模式 --------------------------
        function toggleBatchMode() {
            isBatchMode = !isBatchMode;
            const fileList = document.getElementById('file-list');
            const btn = document.getElementById('btn-batch-delete');
            
            if (isBatchMode) {
                fileList.classList.add('show-checkbox');
                btn.innerText = '✖ 取消批量';
                btn.classList.add('danger');
            } else {
                fileList.classList.remove('show-checkbox');
                btn.innerText = '☑ 批量删除';
                btn.classList.remove('danger');
                selectedItems = [];
                renderFileList(getCurrentFileListFromDOM());
            }
        }

        function getCurrentFileListFromDOM() {
            return currentFileList;
        }

        function toggleSelect(path, checked) {
            if (checked) {
                if (!selectedItems.includes(path)) selectedItems.push(path);
            } else {
                selectedItems = selectedItems.filter(item => item !== path);
            }
            updateBatchButton();
        }

        function updateBatchButton() {
            const btnPaste = document.getElementById('btn-paste');
            btnPaste.disabled = clipboard.paths.length === 0;
        }

        // -------------------------- 右键菜单 --------------------------
        function showContextMenu(e, path, type) {

            document.getElementById('menu-enter').style.display = isFolder ? 'block' : 'none';

                const res = await fetch('/api/create_file', {

        async function uploadFiles(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }
            formData.append('path', currentPath);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.fail && data.fail.length > 0) {
                    alert(`部分文件上传失败：\n${data.fail.join('\n')}`);
                } else {
                    alert(data.msg);
                }

                document.getElementById('file-input').value = '';
                loadFileList();
            } catch (e) {
                alert('上传失败：' + e.message);
            }
        }

        async function openPreview(path) {
            currentActiveItem = path;
            const fileName = path.split('/').pop();
            const ext = fileName.split('.').pop().toLowerCase();
            document.getElementById('preview-title').innerText = `预览：${fileName}`;
            openModal('preview-modal');
            const container = document.getElementById('preview-content');

            const previewExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'mp4', 'webm', 'ogg', 'mp3', 'wav', 'aac', 'flac'];
            
            if (!previewExts.includes(ext)) {
                closeModal('preview-modal');
                openEditor(path);
                return;
            }

            if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'].includes(ext)) {
                container.innerHTML = `<img src="/api/download/${path}" alt="${fileName}">`;
            } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                container.innerHTML = `<video src="/api/download/${path}" controls autoplay></video>`;
            } else if (['mp3', 'wav', 'ogg', 'aac', 'flac'].includes(ext)) {
                container.innerHTML = `<audio src="/api/download/${path}" controls autoplay>`;
            }
        }

        async function saveSettings() {
            const username = document.getElementById('settings-username').value.trim();
            const password = document.getElementById('settings-password').value;
            const maxSizeMB = parseInt(document.getElementById('settings-max-size').value);
            const shareExpireMinutes = parseInt(document.getElementById('settings-share-expire').value);

            if (!username) {
                alert('账号不能为空');
                return;
            }
            if (!maxSizeMB || maxSizeMB <= 0) {
                alert('请输入有效的文件大小');
                return;
            }
            if (isNaN(shareExpireMinutes) || shareExpireMinutes < 0) {
                alert('请输入有效的分享有效期，不能小于0');
                return;
            }

            try {
                const res = await fetch('/api/save_config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        upload_max_size: maxSizeMB * 1024 * 1024,
                        share_expire_minutes: shareExpireMinutes
                    })
                });
                const data = await res.json();
                
                if (data.code !== 0) {
                    alert(data.msg);
                    return;
                }

                alert('保存成功');
                closeModal('settings-modal');
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        // -------------------------- 退出登录 --------------------------
        async function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            try {
                await fetch('/api/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                window.location.href = '/';
            } catch (e) {
                alert('退出失败：' + e.message);
            }
        }

        // -------------------------- 工具函数 --------------------------
        function isTextFile(ext) {
            const textExts = ['.txt', '.html', '.htm', '.css', '.js', '.json', '.xml', '.md', 
                              '.py', '.java', '.c', '.cpp', '.h', '.php', '.go', '.rs', 
                              '.vue', '.jsx', '.tsx', '.ts', '.sh', '.bat', '.cmd', 
                              '.ini', '.conf', '.yml', '.yaml', '.toml', '.env', '.gitignore', '.log',
                              '.exe', '.dll', '.so', '.dylib', '.bin', '.dat']; // 未知类型也尝试文本打开
            return true;
        }

        function getFileIcon(ext) {
            ext = ext.toLowerCase();
            if (['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp', '.svg'].includes(ext)) return '🖼️';
            if (['.mp4', '.webm', '.ogg', '.avi', '.mkv', '.mov'].includes(ext)) return '🎬';
            if (['.mp3', '.wav', '.ogg', '.aac', '.flac'].includes(ext)) return '🎵';
            if (['.zip', '.rar', '.7z', '.tar', '.gz', '.bz2'].includes(ext)) return '📦';
            if (['.pdf'].includes(ext)) return '📕';
            if (['.doc', '.docx'].includes(ext)) return '📘';
            if (['.xls', '.xlsx'].includes(ext)) return '📗';
            if (['.ppt', '.pptx'].includes(ext)) return '📙';
            return '📄';
        }
    </script>
